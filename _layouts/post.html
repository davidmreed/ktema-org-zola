---
layout: default
---

<header>
  <h1 class="post-title">{{ page.title }}</h1>
</header>
<div class="content">
  {% include post-meta.html post=page %}

  <div class="post-body">
    {{ content }} {% include post-tags.html post=page %}
  </div>
  <div>
    <p>
      Share this article:
      <span class="link-icons">
        <a
          class="icon"
          title="Twitter"
          aria-label="Share on Twitter"
          href="https://twitter.com/intent/tweet?text={{ page.title }}&url={{ site.url }}{{ page.url }}&via={{ site.twitter_username }}&related={{ site.twitter_username }}"
          rel="nofollow"
          target="_blank"
          title="Share on Twitter"
        >
          <i class="fab fa-twitter"></i>
        </a>
        <a
          class="icon"
          title="Share on LinkedIn"
          aria-label="Share on LinkedIn"
          href="http://www.linkedin.com/shareArticle?mini=true&url={{ site.url }}{{ page.url }}&title={{ page.title }}&summary={{ page.title }}&source={{ site.url }}"
          target="_blank"
          title="Share on LinkedIn"
        >
          <i class="fab fa-linkedin"></i>
        </a>
        <a
          id="email-link"
          class="icon"
          title="Send Email"
          aria-label="Send Email"
          href="mailto:?subject={{ page.title }}&body={{ page.title }} - {{ site.url }}{{ page.url }}"
          target="_blank"
          title="Send email"
        >
          <i class="fas fa-envelope"></i>
        </a>
      </span>
    </p>
  </div>

  {% include comments.html %} {% include related_posts.html %}
</div>
