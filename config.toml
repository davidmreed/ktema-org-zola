base_url = "https://ktema.org"
compile_sass = false
build_search_index = false
generate_feed = true
feed_filename = "feed.xml"
theme = "datum"

taxonomies = [
    { name = "series", feed = false, render = false }
]

[markdown]
highlight_code = true
highlight_theme = "css"
highlight_themes_css = [
  { theme = "gruvbox-dark", filename = "syntax-theme-dark.css" },
  { theme = "inspired-github", filename = "syntax-theme-light.css" },
]

[extra]

site_owner_name = "David Reed"
site_title = "David Reed"
use_icons = true
use_tocs = false
use_social_sharing = true
timeline_length = 5

